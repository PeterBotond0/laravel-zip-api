opencollection: 1.0.0

info:
  name: laravel-zip-api
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: after-response
      code: bru.setGlobalEnvVar("token", res.body.token);
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
