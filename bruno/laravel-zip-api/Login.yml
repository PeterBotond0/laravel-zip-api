info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/api/login
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "12345678"
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
